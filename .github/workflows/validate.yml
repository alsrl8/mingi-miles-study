name: Validate learning repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate notes and public boundary
        run: python3 scripts/validate.py

      - name: Test learning CLI
        run: bash tests/test_learn.sh

      - name: Check whitespace
        run: git diff --check
