name: Validate learning repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate notes and public boundary
        run: python3 scripts/validate.py

      - name: Test learning CLI
        run: bash tests/test_learn.sh

      - name: Test portable study skill
        run: bash tests/test_skill.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .agents/skills/continue-study/assets/web-ui-template/package-lock.json

      - name: Install Web UI dependencies
        working-directory: .agents/skills/continue-study/assets/web-ui-template
        run: npm ci

      - name: Test Web UI progress fallback
        working-directory: .agents/skills/continue-study/assets/web-ui-template
        run: npm test

      - name: Build Web UI example
        working-directory: .agents/skills/continue-study/assets/web-ui-template
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          ASTRO_BASE: "/mingi-miles-study"
        run: npm run build

      - name: Verify repository-subpath navigation
        working-directory: .agents/skills/continue-study/assets/web-ui-template
        run: |
          grep -Fq 'href="/mingi-miles-study/lessons/git-working-tree/"' dist/index.html
          grep -Fq 'href="/mingi-miles-study/"' dist/lessons/git-working-tree/index.html

      - name: Check whitespace
        run: git diff --check
